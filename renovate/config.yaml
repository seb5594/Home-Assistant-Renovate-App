name: Renovate
version: "2026.11.28"
slug: renovate
description: Keeps the dependencies of your GitHub, GitLab and Gitea repositories up to date, with a web interface inside Home Assistant.
url: https://github.com/seb5594/Home-Assistant-Renovate-App
stage: experimental
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
  - i386
init: false
boot: auto
startup: services
ingress: true
ingress_port: 8099
panel_icon: mdi:package-up
panel_title: Renovate
panel_admin: true
homeassistant_api: true
watchdog: http://[HOST]:[PORT:8099]/api/health
# Webhooks are optional. The port stays closed until you give it a number in the network settings.
ports:
  5594/tcp: null
ports_description:
  5594/tcp: Receives webhooks from your git server
map:
  - addon_config:ro
  - ssl:ro
# The cache is rebuilt on demand and the logs are only history, so neither belongs in a backup.
backup_exclude:
  - cache/**
  - runs/**
# --- generated by tools/sync-config.mjs: do not edit below this line ---
options:
  renovate:
    ignored_authors: []
    default_extends: []
    default_labels: []
    host_rules: []
  updates: {}
  history: {}
  resources: {}
  schedule: {}
  webhooks: {}
  home_assistant: {}
  general: {}
  advanced:
    extra_packages: []
    extra_env: []
schema:
  renovate:
    dry_run: list(off|extract|lookup|full)?
    onboarding: bool?
    onboarding_preset: str?
    require_config: list(required|optional|ignored)?
    git_author: str?
    ignored_authors:
      - str
    default_extends:
      - str
    default_labels:
      - str
    pr_concurrent_limit: int(0,100)?
    pr_hourly_limit: int(0,100)?
    github_com_token: password?
    host_rules:
      - match_host: str
        username: str?
        password: password?
        token: password?
    config_file: str?
  updates:
    major: list(repository|pr|approval|automerge|ignore)?
    minor: list(repository|pr|approval|automerge|ignore)?
    patch: list(repository|pr|approval|automerge|ignore)?
    group_non_major: bool?
    minimum_age_days: int(0,90)?
    merge_method: list(auto|squash|rebase|merge)?
    dashboard: bool?
  history:
    keep_runs: int(10,5000)?
    keep_log_days: int(1,365)?
  resources:
    profile: list(auto|light|balanced|performance)?
    max_concurrent_runs: int(1,4)?
    memory_limit_mb: int(256,16384)?
    batch_size: int(1,100)?
    cpu_priority: int(0,19)?
    run_timeout_minutes: int(5,720)?
  schedule:
    mode: list(cron|interval|manual)?
    cron: str?
    interval_minutes: int(5,10080)?
    run_on_start: bool?
  webhooks:
    enabled: bool?
    port: int(1024,65535)?
    public_url: url?
    debounce_seconds: int(5,3600)?
    ignore_own_events: bool?
  home_assistant:
    sensors: bool?
    events: bool?
    failure_notification: bool?
  general:
    language: list(auto|en|de)?
    theme: list(auto|light|dark)?
    accent: list(blue|home_assistant|custom)?
    accent_color: str?
    log_level: list(debug|info|warn|error)?
    timezone: str?
  advanced:
    renovate_log_level: list(debug|info|warn|error)?
    extra_packages:
      - str
    extra_env:
      - name: str
        value: str
    ca_certificate: str?
    insecure_tls: bool?
    github_client_id: str?
